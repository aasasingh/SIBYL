[project]
name = "sibyl"
version = "0.1.0"
description = "Prediction-market fair-value & edge engine (Polymarket + Kalshi)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiolimiter>=1.2.1",
    "cryptography>=49.0.0",
    "duckdb>=1.5.4",
    "httpx[http2]>=0.28.1",
    "msgspec>=0.21.1",
    "numpy>=2.5.4",
    "polars>=1.43.0",
    "pyarrow>=25.0.0",
    "pydantic>=2",
    "pydantic-settings>=2.14.2",
    "pytz>=2026.2",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "structlog>=26.1.0",
    "tenacity>=9.1.4",
    "websockets>=16.1.1",
]

[project.scripts]
sibyl = "sibyl.cli:main"

[build-system]
requires = ["uv_build>=0.11.30,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "freezegun>=1.5.5",
    "hypothesis>=6.158.1",
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.15.22",
]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests"]
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]

[[tool.mypy.overrides]]
module = ["pyarrow.*", "scipy.*"]
ignore_missing_imports = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "A", "C4", "DTZ", "T20", "SIM", "RUF"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q -m \"not live\""
markers = [
    "live: tests that hit real network endpoints (deselect with '-m \"not live\"')",
]
